<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="title">
  <title id="title">Computing Power Network: share and use GPU computing power for ROS 2 across your PCs</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0B0B"/>
      <stop offset="0.6" stop-color="#120A0A"/>
      <stop offset="1" stop-color="#2A080B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.52" r="0.4">
      <stop offset="0" stop-color="#A4161A" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#A4161A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#F2E8D5" fill-opacity="0.07"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="420" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <rect width="1280" height="420" fill="url(#glow)"/>
    <rect y="408" width="1280" height="12" fill="#8B0000"/>
  </g>

  <g font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
    <text x="72" y="98" fill="#C8333A" font-size="15" font-weight="600" letter-spacing="4">ROS 2 · OFFLOAD · DISTRIBUTE · WAKE ANYWHERE</text>
    <text x="66" y="178" font-size="76" font-weight="800" letter-spacing="3"><tspan fill="#F2E8D5">COMPUTING</tspan></text>
    <text x="66" y="252" font-size="76" font-weight="800" letter-spacing="3"><tspan fill="#B3141B">POWER</tspan><tspan fill="#F2E8D5"> NETWORK</tspan></text>
    <rect x="72" y="276" width="84" height="5" rx="2.5" fill="#B3141B"/>
    <text x="72" y="322" fill="#F2E8D5" fill-opacity="0.92" font-size="25">Use the GPU power of every PC you have, from your laptop</text>
    <text x="72" y="374" fill="#F2E8D5" fill-opacity="0.55" font-size="13" letter-spacing="3">ROBOBADGERS ROMANIA · TEAM BADGERLABS · NUCLEAR POWERPLANTS</text>
  </g>

  <!-- the network: links -->
  <g stroke="#A4161A" stroke-width="2.5" stroke-opacity="0.75" fill="none">
    <line x1="1010" y1="210" x2="890" y2="118"/>
    <line x1="1010" y1="210" x2="1150" y2="122"/>
    <line x1="1010" y1="210" x2="880" y2="300"/>
    <line x1="1010" y1="210" x2="1160" y2="304"/>
    <line x1="890" y1="118" x2="1150" y2="122" stroke-dasharray="6 7" stroke-opacity="0.45"/>
    <line x1="880" y1="300" x2="1160" y2="304" stroke-dasharray="6 7" stroke-opacity="0.45"/>
  </g>
  <!-- hub: your laptop (NodeUser) -->
  <g>
    <rect x="968" y="184" width="84" height="54" rx="6" fill="#0B0B0B" stroke="#F2E8D5" stroke-width="3"/>
    <rect x="952" y="240" width="116" height="9" rx="3" fill="#F2E8D5"/>
    <text x="1010" y="218" text-anchor="middle" fill="#F2E8D5" font-family="Consolas, monospace" font-size="15">ros2</text>
  </g>
  <!-- powerplants (ProcessingNodes) with status dots -->
  <g font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#F2E8D5" fill-opacity="0.8" text-anchor="middle">
    <g transform="translate(890 118)">
      <rect x="-34" y="-30" width="68" height="60" rx="8" fill="#140C0C" stroke="#F2E8D5" stroke-width="2.5"/>
      <rect x="-22" y="-14" width="44" height="10" rx="2" fill="#B3141B"/><rect x="-22" y="2" width="44" height="10" rx="2" fill="#B3141B" fill-opacity="0.6"/>
      <circle cx="26" cy="-22" r="7" fill="#40CC74"/><text y="50">RTX 4090</text>
    </g>
    <g transform="translate(1150 122)">
      <rect x="-34" y="-30" width="68" height="60" rx="8" fill="#140C0C" stroke="#F2E8D5" stroke-width="2.5"/>
      <rect x="-22" y="-14" width="44" height="10" rx="2" fill="#B3141B"/><rect x="-22" y="2" width="44" height="10" rx="2" fill="#B3141B" fill-opacity="0.6"/>
      <circle cx="26" cy="-22" r="7" fill="#F2C036"/><text y="50">GTX 1080</text>
    </g>
    <g transform="translate(880 300)">
      <rect x="-34" y="-30" width="68" height="60" rx="8" fill="#140C0C" stroke="#F2E8D5" stroke-width="2.5"/>
      <rect x="-22" y="-14" width="44" height="10" rx="2" fill="#B3141B"/><rect x="-22" y="2" width="44" height="10" rx="2" fill="#B3141B" fill-opacity="0.6"/>
      <circle cx="26" cy="-22" r="7" fill="#40CC74"/><text y="50">RTX 5070</text>
    </g>
    <g transform="translate(1160 304)">
      <rect x="-34" y="-30" width="68" height="60" rx="8" fill="#140C0C" stroke="#F2E8D5" stroke-width="2.5" stroke-opacity="0.5"/>
      <rect x="-22" y="-14" width="44" height="10" rx="2" fill="#B3141B" fill-opacity="0.35"/><rect x="-22" y="2" width="44" height="10" rx="2" fill="#B3141B" fill-opacity="0.2"/>
      <circle cx="26" cy="-22" r="7" fill="#E24C4C"/><text y="50">asleep</text>
    </g>
  </g>
</svg>
